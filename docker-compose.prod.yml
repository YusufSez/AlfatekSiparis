services:
  api:
    build:
      context: .
      target: api
    ports:
      # Host loopback only — expose via reverse proxy / firewall rules
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_URL: file:./data/prod.db
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY is required}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY is required}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:admin@localhost}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      # Enable only when a reverse proxy overwrites X-Forwarded-For (e.g. nginx $remote_addr).
      TRUST_PROXY: ${TRUST_PROXY:-0}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      GIT_COMMIT: ${GIT_COMMIT:-}
      BUILD_DATE: ${BUILD_DATE:-}
    volumes:
      - api_data:/app/apps/api/prisma/data
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:?VITE_VAPID_PUBLIC_KEY is required}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
