server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Production SPA security headers (this file is only used by the Docker web image — not Vite).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https:; media-src 'self'; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: wss: ws:; worker-src 'self'; manifest-src 'self'" always;
  # Docker web serves HTTP on :80; TLS is expected at the edge. Edge should prefer its own HSTS;
  # include here so direct HTTPS terminators that forward to this vhost still advertise HSTS.
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|svg|ico|webmanifest)$ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  }
}
