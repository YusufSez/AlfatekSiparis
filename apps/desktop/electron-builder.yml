appId: com.alfatek.ofis-siparis
productName: Alfatek Ofis Sipariş
copyright: Copyright © Alfatek
electronVersion: 37.10.3

directories:
  output: dist
  buildResources: build

# ≥256px required by electron-builder (converts to .ico / .icns).
# Source: apps/web/public/pwa-512.png → build/icon.png
# Runtime window/tray: assets/app-icon.ico (from apps/web/public/favicon.ico)
icon: build/icon.png

files:
  - main.js
  - preload.js
  - crashLog.js
  - package.json
  - start-url.json
  - assets/**/*

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  category: public.app-category.business
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # Notarization / Apple Developer signing is optional and done on a Mac host.
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# Runtime loads DESKTOP_START_URL (production SPA). Web dist is not bundled.
extraMetadata:
  main: main.js
