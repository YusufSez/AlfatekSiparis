services:
  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
      - sqlite_data:/app/apps/api/prisma
    command: sh -c "npm install && npm run db:setup -w apps/api && npm run dev -w apps/api"
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: docker-dev-secret
      DATABASE_URL: file:./dev.db
      CORS_ORIGIN: http://localhost:5173
      SESSION_DURATION_SEC: 120

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -w apps/web -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  api_node_modules:
  web_node_modules:
  sqlite_data:
